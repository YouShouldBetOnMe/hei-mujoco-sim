name: Scene and Grip Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  physics:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_standalone.py
      - run: hei-mujoco --verify-files --physics-only
      - run: hei-grasp-check
      - name: Linux EGL Render
        if: runner.os == 'Linux'
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglfw3
          hei-mujoco --check
